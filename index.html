<style>

  :root {

  .btn.plain { background: transparent; border-color: transparent; color: var(--indigo); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--white); }
  .btn.lime { background: var(--lime); border-color: var(--lime); color: var(--ink); }

  .media video { background: transparent; }

  .pill { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; background: var(--white); color: var(--ink); }
  .pill.season-bfcm { background: var(--ink); color: var(--white); }
  .pill.season-evergreen { background: var(--ink); color: var(--white); }
  .pill.pill-fav { background: var(--lime); color: var(--ink); }
  .play { position: absolute; inset: 0; margin: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .5); cursor: pointer; display: grid; place-items: center; transition: transform .15s; }
  .play svg { width: 15px; height: 15px; margin-left: 2px; fill: var(--ink); }

  .info { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: -.01em; min-width: 0; }
  .brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo, .initial { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: var(--white); }
  .initial { display: grid; place-items: center; font-size: 12px; background: var(--lav-tint); color: var(--indigo); }
  .sub { font-size: 12px; color: var(--quiet); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .tag { font-size: 12px; padding: 3px 7px; border-radius: 4px; font-weight: 500; line-height: 1.3; }
  .tag.fmt { background: var(--lav-tint); color: var(--indigo); cursor: help; }

  dialog::backdrop { background: rgba(43, 18, 80, .55); }

:"image","thumb":"assets/thumbs/b-your-heights-s-evergreen-vf-sign-ot-none.jpg","brand":"Your Heights","brandKey":"yourheights","creator":"","logo":"","category":"Supplements","formats":["sign"],"defs":{"sign":"A person holding a handmade sign with the message handwritten on it, shot in a real-world scene with the product beside them."},"favorite":false,"offers":["none"]},{"id":"b-your-heights-s-evergreen-vf-us-vs-them-ot-none","file":"files/b=your-heights_s=evergreen_vf=us-vs-them_ot=none.jpeg","fileName":"b=your-heights_s=evergreen_vf=us-vs-them_ot=none.jpeg","season":"evergreen","kind":"image","thumb":"assets/thumbs/b-your-heights-s-evergreen-vf-us-vs-them-ot-none.jpg","brand":"Your Heights","brandKey":"yourheights","creator":"","logo":"","category":"Supplements","formats":["us-vs-them"],"defs":{"us-vs-them":"A two-column comparison, brand vs. competitor/old way, 4-7 rows of buyer-language criteria."},"favorite":false,"offers":["none"]},{"id":"b-your-heights-s-evergreen-vf-yapper-ot-none","file":"files/b=your-heights_s=evergreen_vf=yapper_ot=none.mp4","fileName":"b=your-heights_s=evergreen_vf=yapper_ot=none.mp4","season":"evergreen","kind":"video","thumb":"assets/thumbs/b-your-heights-s-evergreen-vf-yapper-ot-none.jpg","brand":"Your Heights","brandKey":"yourheights","creator":"","logo":"","category":"Supplements","formats":["yapper"],"defs":{"yapper":"Fast, high-energy talking-head monologue straight to camera, no founder framing, no on-screen evidence."},"favorite":false,"offers":["none"]}],"offerLabels":{"amount-off":"Amount off","free-gift":"Free gift","bundle":"Bundle","tiered":"Tiered","buy-x-get-y":"Buy X, get Y","other":"Other","none":"None"},"categories":["Hair","Jewelry & accessories","Apparel","Home","Beauty","Personal care","Supplements","Coffee","Food & drink","Health & telehealth","Baby & kids","Pets","Apps & services","Automotive","Fitness & sports","Stationery","Other"],"emerging":["annotation","cart-screenshot","doodle","faq","fortune-cookie","handwritten","live-demo","point-to-screen","signature-series","swatch-picker"]};
const items = DATA.items, OFFER = DATA.offerLabels;
const OFFER_ORDER = Object.keys(OFFER);
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const pretty = (s) => { const t = s.replace(/-/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); };
const seasonName = { evergreen: "Evergreen", bfcm: "Black Friday" };
const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const humanDate = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${months[+m[2] - 1]} ${+m[3]}, ${m[1]}` : (iso || ""); };
const fmtLabel = (it) => it.formats.map(pretty).join(" + ") || "No format yet";
function mixKey(id) { let h = 0x811c9dc5; for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 0x01000193) >>> 0; return h; }
items.sort((a, b) => mixKey(a.id) - mixKey(b.id) || a.id.localeCompare(b.id));

// ---- state (mirrored in the URL so a filtered view can be shared) ----
const state = { season: "", media: "", category: [], brand: [], format: [], offer: [] };
const MULTI = ["category", "brand", "format", "offer"];
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.season = ["evergreen", "bfcm", "favorite"].includes(p.get("season")) ? p.get("season") : "";
  state.media = ["image", "video"].includes(p.get("media")) ? p.get("media") : "";
  for (const k of MULTI) state[k] = (p.get(k) || "").split(",").filter(Boolean);
}
function writeHash() {
  const p = new URLSearchParams();
  if (state.season) p.set("season", state.season);
  if (state.media) p.set("media", state.media);
  for (const k of MULTI) if (state[k].length) p.set(k, state[k].join(","));
  const h = p.toString();
  history.replaceState(null, "", h ? "#" + h.replace(/%2C/g, ",") : location.pathname + location.search);
}

const valuesOf = { category: (it) => [it.category], brand: (it) => it.brandKey ? [it.brandKey] : [], format: (it) => it.formats, offer: (it) => it.offers || [] };
const anyOf = (picked, vals) => !picked.length || picked.some((p) => vals.includes(p));
function matches(it, skip) {
  if (skip !== "season" && state.season && (state.season === "favorite" ? !it.favorite : it.season !== state.season)) return false;
  if (skip !== "media" && state.media && it.kind !== state.media) return false;
  for (const k of MULTI) if (k !== skip && !anyOf(state[k], valuesOf[k](it))) return false;
  return true;
}

// ---- multi-select dropdowns ----
const brandLabel = {}; for (const it of items) if (it.brandKey) brandLabel[it.brandKey] = it.brand;
const allValues = {
  category: DATA.categories.filter((c) => items.some((i) => i.category === c)),
  brand: Object.keys(brandLabel).sort((a, b) => brandLabel[a].localeCompare(brandLabel[b])),
  format: [...new Set(items.flatMap((i) => i.formats))].sort(),
  offer: OFFER_ORDER.filter((o) => items.some((i) => (i.offers || []).includes(o))),
};
const optLabel = { category: (v) => v, brand: (v) => brandLabel[v], format: pretty, offer: (v) => OFFER[v] || pretty(v) };
const placeholder = { category: "All categories", brand: "All brands", format: "All visual formats", offer: "All offer types" };
const EMERGING = new Set(DATA.emerging || []);
const hints = {};
const ms = {};
for (const field of document.querySelectorAll("[data-ms]")) {
  const key = field.dataset.ms;
  const btn = el("button", "ms-btn"); btn.type = "button"; btn.setAttribute("aria-haspopup", "listbox");
  const panel = el("div", "panel");
  const search = el("input"); search.type = "search"; search.placeholder = "Search"; search.setAttribute("aria-label", "Search " + key);
  const ul = el("ul");
  const clear = el("button", "clear", "Clear"); clear.type = "button";
  if (allValues[key].length > 8) panel.append(search);
  panel.append(ul, clear);
  field.append(btn, panel);
  if (hints[key]) field.append(el("span", "hint", hints[key]));
  const boxes = {};
  for (const v of allValues[key]) {
    const li = el("li"); const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.value = v;
    const name = el("span", null, optLabel[key](v)); const c = el("span", "c");
    lab.append(cb, name);
    if (key === "format" && EMERGING.has(v)) lab.append(el("span", "bubble", "Emerging"));
    lab.append(c); li.append(lab); ul.append(li);
    cb.addEventListener("change", () => { state[key] = allValues[key].filter((x) => boxes[x].cb.checked); update(); });
    boxes[v] = { cb, c, li, text: optLabel[key](v).toLowerCase() };
  }
  search.addEventListener("input", () => visibility(key));
  btn.addEventListener("click", () => { const open = !field.classList.contains("open"); document.querySelectorAll(".field.open").forEach((f) => f.classList.remove("open")); if (open) { field.classList.add("open"); (allValues[key].length > 8 ? search : ul.querySelector("input"))?.focus(); } });
  clear.addEventListener("click", () => { state[key] = []; update(); });
  ms[key] = { btn, boxes, field, search };
}
document.addEventListener("click", (e) => { if (!e.target.closest(".field")) document.querySelectorAll(".field.open").forEach((f) => f.classList.remove("open")); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".field.open").forEach((f) => f.classList.remove("open")); });

// Brand list only offers brands that still have ads under the other filters (e.g. the picked categories).
const HIDE_EMPTY = { brand: true };
function visibility(key) {
  const { boxes, search } = ms[key];
  const q = search.value.trim().toLowerCase();
  for (const b of Object.values(boxes)) b.li.hidden = (q && !b.text.includes(q)) || (HIDE_EMPTY[key] && !b.n && !b.cb.checked);
}
function syncControls() {
  document.querySelectorAll(".seasons button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.season === state.season)));
  $("#media").value = state.media;
  for (const key of MULTI) {
    const { btn, boxes } = ms[key];
    const pool = items.filter((it) => matches(it, key));
    const counts = {}; for (const it of pool) for (const v of valuesOf[key](it)) counts[v] = (counts[v] || 0) + 1;
    for (const [v, b] of Object.entries(boxes)) { b.cb.checked = state[key].includes(v); b.c.textContent = counts[v] || 0; b.n = counts[v] || 0; b.li.classList.toggle("zero", !counts[v]); }
    visibility(key);
    const sel = state[key];
    btn.textContent = !sel.length ? placeholder[key] : sel.length === 1 ? optLabel[key](sel[0]) : `${sel.length} selected`;
    btn.classList.toggle("active", sel.length > 0);
  }
  const sc = countSeasons();
  for (const [s, n] of Object.entries(sc)) { const span = document.querySelector(`[data-sn="${s}"]`); if (span) span.textContent = n; }
  const mediaPool = items.filter((it) => matches(it, "media"));
  const vids = mediaPool.filter((i) => i.kind === "video").length;
  const opts = $("#media").options; opts[0].text = `All (${mediaPool.length})`; opts[1].text = `Images (${mediaPool.length - vids})`; opts[2].text = `Videos (${vids})`;
}
function countSeasons() {
  const pool = items.filter((it) => matches(it, "season"));
  return { "": pool.length, evergreen: pool.filter((i) => i.season === "evergreen").length, bfcm: pool.filter((i) => i.season === "bfcm").length, favorite: pool.filter((i) => i.favorite).length };
}

// ---- cards ----
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>';
function brandRow(it) {
  const row = el("div", "brand");
  if (it.logo) { const img = el("img", "logo"); img.src = it.logo; img.alt = ""; img.loading = "lazy"; row.append(img); }
  else row.append(el("span", "initial", (it.brand || it.creator || "?").charAt(0).toUpperCase()));
  row.append(el("span", null, it.brand || it.creator || "Unknown brand"));
  return row;
}
function tagList(it) {
  const t = el("div", "tags");
  for (const f of it.formats) { const g = el("span", "tag fmt", pretty(f)); g.dataset.tip = (EMERGING.has(f) ? "🌱 Emerging. " : "") + (it.defs[f] || "This format isn't in the library's format list yet."); t.append(g); }
  for (const o of it.offers || []) t.append(el("span", "tag offer", o === "none" ? "No offer" : OFFER[o] || pretty(o)));
  return t;
}
function playVideo(media, it) {
  const v = el("video"); v.src = it.file; v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = "auto";
  if (it.thumb) v.poster = it.thumb;
  media.querySelector("img")?.remove(); media.querySelector(".play")?.remove(); media.prepend(v);
  v.addEventListener("click", (e) => e.stopPropagation());
  document.querySelectorAll(".media video").forEach((o) => { if (o !== v) o.pause(); });
}
function card(it) {
  const c = el("article", "card"); c.tabIndex = 0; c.setAttribute("aria-label", `${it.brand || it.creator} ad, ${fmtLabel(it)}`);
  const media = el("div", "media");
  const bg = el("div", "bg"); bg.style.backgroundImage = `url("${it.thumb || it.file}")`; media.append(bg);
  const img = el("img"); img.src = it.thumb || it.file; img.alt = `${it.brand || it.creator} ad, ${fmtLabel(it)}`; img.loading = "lazy";
  media.append(img);
  const top = el("div", "chip-top");
  top.append(el("span", "pill season-" + it.season, seasonName[it.season]));
  if (it.favorite) top.append(el("span", "pill pill-fav", "⭐ Favorite"));
  media.append(top);
  if (it.kind === "video") {
    const p = el("button", "play"); p.type = "button"; p.innerHTML = PLAY; p.setAttribute("aria-label", "Play video");
    p.addEventListener("click", (e) => { e.stopPropagation(); playVideo(media, it); });
    media.append(p);
  }
  const info = el("div", "info");
  info.append(brandRow(it));
  if (it.creator && it.brand) info.append(el("div", "sub", "Creator: " + it.creator));
  info.append(tagList(it));
  c.append(media, info);
  c.addEventListener("click", () => openDetails(it));
  c.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target === c) openDetails(it); });
  return c;
}

// ---- details dialog ----
const dlg = $("#dlg");
function openDetails(it) {
  document.querySelectorAll(".media video").forEach((v) => v.pause());
  $("#dlg-title").textContent = fmtLabel(it);
  const m = $("#dlg-media"); m.replaceChildren();
  if (it.kind === "video") { const v = el("video"); v.src = it.file; v.controls = true; v.autoplay = true; v.playsInline = true; if (it.thumb) v.poster = it.thumb; m.append(v); }
  else { const img = el("img"); img.src = it.file; img.alt = fmtLabel(it); m.append(img); }
  const rows = $("#dlg-rows"); rows.replaceChildren();
  const add = (label, text, mono) => { if (!text) return; const r = el("div", "row"); r.append(el("strong", null, label), el("p", mono ? "mono" : null, text)); rows.append(r); };
  add("Season", seasonName[it.season]);
  add("Brand", it.brand);
  add("Creator", it.creator);
  for (const v of it.formats) add(`What ${pretty(v)} means`, (EMERGING.has(v) ? "Emerging format, seen only a few times so far. " : "") + (it.defs[v] || "This format isn't in the library's format list yet."));
  if (it.offers) add("Offer type", it.offers.map((o) => OFFER[o] || pretty(o)).join(" + "));
  add("Tagging note", it.note); if (it.note) rows.lastElementChild.classList.add("quote");
  add("File", it.fileName, true);
  $("#dlg-full").href = it.file;
  $("#dlg-motion").hidden = $("#dlg-note").hidden = !it.motion;
  if (it.motion) $("#dlg-motion").href = it.motion;
  dlg.showModal();
}
const closeDlg = () => dlg.close();
dlg.addEventListener("close", () => $("#dlg-media").replaceChildren());
$("#dlg-x").addEventListener("click", closeDlg); $("#dlg-done").addEventListener("click", closeDlg);
dlg.addEventListener("click", (e) => { if (e.target === dlg) closeDlg(); });

// ---- format tooltips ----
const tip = $("#tip");
document.addEventListener("mouseover", (e) => {
  const g = e.target.closest?.(".tag.fmt"); if (!g) { tip.hidden = true; return; }
  tip.replaceChildren(el("b", null, g.textContent), document.createTextNode(g.dataset.tip)); tip.hidden = false;
  const r = g.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  tip.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + "px";
});
addEventListener("scroll", () => { tip.hidden = true; }, { passive: true });

// ---- render ----
const PAGE = 40; let shown = PAGE;
function render(reset = true) {
  if (reset) shown = PAGE;
  const list = items.filter((it) => matches(it));
  $("#gallery").replaceChildren(...list.slice(0, shown).map(card));
  $("#gallery").hidden = !list.length; $("#empty").hidden = !!list.length; $("#more").hidden = list.length <= shown;
  $("#readout").textContent = `Showing ${list.length} of ${items.length} ads`;
}
function update() { writeHash(); syncControls(); render(); }

document.querySelectorAll(".seasons button").forEach((b) => b.addEventListener("click", () => { state.season = b.dataset.season; update(); }));
$("#media").addEventListener("change", (e) => { state.media = e.target.value; update(); });
$("#reset").addEventListener("click", () => { Object.assign(state, { season: "", media: "", category: [], brand: [], format: [], offer: [] }); update(); });
$("#more").addEventListener("click", () => { shown += PAGE; render(false); });
window.addEventListener("hashchange", () => { readHash(); syncControls(); render(); });

const allBrands = new Set(items.map((i) => i.brandKey).filter(Boolean)).size;
const allFormats = new Set(items.flatMap((i) => i.formats)).size;
$("#counts").textContent = `${allFormats} formats · ${allBrands} brands`;
// Ticker: the most-used formats, alternating lime and white, separated by //
const fcount = {}; for (const it of items) for (const f of it.formats) fcount[f] = (fcount[f] || 0) + 1;
const topF = Object.entries(fcount).sort((a, b) => b[1] - a[1]).slice(0, 14).map(([f]) => f);
const tk = $("#ticker");
for (let r = 0; r < 2; r++) topF.forEach((f, i) => { tk.append(el("span", "tick" + (i % 2 ? "" : " lime"), pretty(f) + (EMERGING.has(f) ? " 🌱" : ""))); tk.append(el("span", "tick sep", "//")); });
$("#status").hidden = true;
readHash(); update();
</script>
